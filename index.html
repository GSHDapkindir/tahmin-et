<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>GALATASARAY KADRO KURUCU</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#a40000;
    --red2:#d80000;
    --yellow:#ffd400;
    --yellow2:#ffe96a;
}

body{
    min-height:100vh;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(170,0,0,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 95%,
            rgba(255,212,0,.12),
            transparent 30%
        ),
        #070709;
}

/* ================= HEADER ================= */

.header{
    padding:16px;

    background:
        linear-gradient(
            135deg,
            #08080b,
            #18181e
        );

    border-bottom:
        1px solid
        rgba(255,212,0,.2);

    box-shadow:
        0 8px 35px rgba(0,0,0,.5);
}

.header-inner{
    max-width:1200px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #a40000,
            #e00000
        );

    border:
        3px solid
        var(--yellow);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:1000;

    box-shadow:
        0 0 20px
        rgba(255,212,0,.3);
}

.brand h1{
    font-size:19px;
    font-weight:1000;
}

.brand p{
    margin-top:4px;
    color:#8d9098;
    font-size:11px;
}

.actions{
    display:flex;
    gap:8px;
}

.btn{
    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:10px;

    padding:11px 14px;

    color:#fff;

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}

.save{
    background:
        linear-gradient(
            135deg,
            #a50000,
            #dc0000
        );
}

.reset{
    background:#24242a;
}

/* ================= CONTROLS ================= */

.controls{
    max-width:1200px;
    margin:16px auto 10px;
    padding:0 15px;
}

.control{
    background:
        rgba(18,18,23,.96);

    border:
        1px solid
        rgba(255,212,0,.12);

    border-radius:14px;

    padding:11px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;
}

select{
    background:#24242a;
    color:#fff;

    border:
        1px solid
        rgba(255,212,0,.2);

    border-radius:9px;

    padding:11px 14px;

    font-size:12px;
    font-weight:900;

    outline:none;
}

.progress-area{
    display:flex;
    align-items:center;
    gap:9px;

    color:#9b9da5;

    font-size:11px;
    font-weight:700;
}

.progress{
    width:130px;
    height:6px;

    background:#292930;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--red),
            var(--yellow)
        );

    transition:.3s;
}

/* ================= MAIN ================= */

.main{
    padding:0 15px 40px;
}

.pitch-wrap{
    width:100%;
    max-width:720px;
    margin:auto;
}

/* ================= PITCH ================= */

.pitch{
    position:relative;

    width:100%;

    aspect-ratio:1 / 1.43;

    overflow:hidden;

    border-radius:22px;

    border:
        4px solid
        #ffe46b;

    background:

        repeating-linear-gradient(
            90deg,
            rgba(160,0,0,.16) 0px,
            rgba(160,0,0,.16) 75px,
            rgba(255,215,0,.08) 75px,
            rgba(255,215,0,.08) 150px
        ),

        linear-gradient(
            145deg,
            #6f0909,
            #9e0808 35%,
            #6b0808 70%,
            #b10b0b
        );

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 0 100px rgba(0,0,0,.35),
        0 0 45px rgba(255,212,0,.12);
}

.pitch:before{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,230,90,.16),
            transparent 42%
        );

    pointer-events:none;
}

/* ================= PITCH LINES ================= */

.line{
    position:absolute;

    border:
        2px solid
        rgba(255,235,120,.8);

    pointer-events:none;
}

.half{
    width:100%;
    height:0;

    top:50%;
    left:0;
}

.circle{
    width:25%;
    aspect-ratio:1;

    border-radius:50%;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);
}

.dot{
    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ffe96a;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

.penalty{
    position:absolute;

    width:48%;
    height:18%;

    left:26%;

    border:
        2px solid
        rgba(255,235,120,.8);
}

.penalty.top{
    top:0;
    border-top:0;
}

.penalty.bottom{
    bottom:0;
    border-bottom:0;
}

.goal{
    position:absolute;

    width:18%;
    height:6%;

    left:41%;

    border:
        2px solid
        rgba(255,235,120,.8);
}

.goal.top{
    top:0;
    border-top:0;
}

.goal.bottom{
    bottom:0;
    border-bottom:0;
}

/* ================= POSITIONS ================= */

.position{
    position:absolute;

    transform:
        translate(-50%,-50%);

    left:var(--x);
    top:var(--y);

    width:100px;
    height:55px;

    z-index:20;
}

.position button{
    width:100%;
    height:100%;

    border:0;

    background:transparent;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
}

/* ================= PLUS ================= */

.position.empty button{

    width:58px;
    height:58px;

    margin:auto;

    border-radius:50%;

    border:
        3px solid
        var(--yellow);

    background:
        radial-gradient(
            circle,
            rgba(255,212,0,.3),
            rgba(160,0,0,.85)
        );

    box-shadow:
        0 0 0 5px
        rgba(255,212,0,.12),

        0 0 25px
        rgba(255,212,0,.55),

        0 8px 20px
        rgba(0,0,0,.6);

    animation:pulse 1.8s infinite;
}

.plus{
    font-size:34px;
    font-weight:300;
    color:#fff;
}

@keyframes pulse{

    0%,100%{
        box-shadow:
            0 0 0 5px
            rgba(255,212,0,.1),
            0 0 20px
            rgba(255,212,0,.4);
    }

    50%{
        box-shadow:
            0 0 0 9px
            rgba(255,212,0,.05),
            0 0 35px
            rgba(255,212,0,.8);
    }
}

/* =================================================
   SEÇİLMİŞ FUTBOLCU
   SADECE İSİM
================================================= */

.player{
    position:relative;

    width:100%;

    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;
}

/* AVATAR TAMAMEN YOK */

.player-name{

    position:relative;

    display:block;

    white-space:nowrap;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #8e0000,
            #c80000
        );

    border:
        2px solid
        var(--yellow);

    border-radius:9px;

    padding:
        8px 11px;

    font-size:10px;

    line-height:1.1;

    font-weight:1000;

    text-align:center;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.65),

        0 0 15px
        rgba(255,212,0,.2);

    z-index:30;
}

/* ================= MAÇIN OYUNCUSU ================= */

.motm-section{
    max-width:720px;

    margin:16px auto 0;

    display:none;
}

.motm-section.show{
    display:block;
}

.motm-card{

    background:
        linear-gradient(
            135deg,
            rgba(30,8,8,.98),
            rgba(18,18,22,.98)
        );

    border:
        1px solid
        rgba(255,212,0,.28);

    border-radius:15px;

    padding:15px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);
}

.motm-title{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:14px;
    font-weight:1000;
}

.motm-title span{
    color:var(--yellow);
}

.motm-sub{

    margin-top:4px;

    color:#888c95;

    font-size:10px;
}

.motm-select{

    width:100%;

    margin-top:11px;

    padding:12px;

    border-radius:10px;

    background:#25252c;

    border:
        1px solid
        rgba(255,212,0,.2);

    color:#fff;

    font-size:12px;

    font-weight:800;

    outline:none;
}

/* MAÇIN OYUNCUSU YILDIZI */

.motm-star{

    position:absolute;

    top:-15px;
    right:-8px;

    z-index:100;

    font-size:20px;

    filter:
        drop-shadow(
            0 2px 5px #000
        );
}

/* ================= MODAL ================= */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:blur(10px);

    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-card{

    width:min(680px,100%);

    max-height:90vh;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #131318,
            #09090c
        );

    border:
        1px solid
        rgba(255,212,0,.25);

    border-radius:20px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.8);
}

.modal-header{

    padding:17px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.modal-title{

    font-size:17px;
    font-weight:1000;
}

.modal-sub{

    margin-top:4px;

    color:#858891;

    font-size:10px;
}

.close{

    width:36px;
    height:36px;

    border-radius:50%;

    border:0;

    background:#27272d;

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

.modal-content{

    padding:15px;

    overflow-y:auto;

    max-height:
        calc(90vh - 75px);
}

.search{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:
        1px solid
        rgba(255,212,0,.15);

    background:#202027;

    color:#fff;

    outline:none;

    font-size:13px;

    margin-bottom:12px;
}

.filters{

    display:flex;

    gap:7px;

    overflow-x:auto;

    margin-bottom:12px;
}

.filter{

    flex:none;

    padding:9px 12px;

    border-radius:8px;

    border:0;

    background:#24242b;

    color:#9da0a8;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}

.filter.active{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #a40000,
            #d80000
        );
}

.player-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;
}

.player-option{

    min-height:65px;

    padding:9px;

    border-radius:11px;

    background:#1b1b21;

    border:
        1px solid
        rgba(255,255,255,.06);

    display:flex;

    align-items:center;

    gap:10px;

    text-align:left;

    cursor:pointer;

    color:#fff;
}

.player-option:hover{

    background:#28282f;

    border-color:
        rgba(255,212,0,.4);
}

.player-option.used{

    opacity:.25;

    cursor:not-allowed;
}

.option-avatar{

    width:42px;
    height:42px;

    flex:none;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #a40000,
            #df0000,
            #e9c000
        );

    border:
        2px solid
        #ffe05a;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:1000;
}

.option-name{

    font-size:12px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.option-pos{

    color:#888c95;

    font-size:9px;

    margin-top:3px;
}

/* ================= TOAST ================= */

.toast{

    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,30px);

    opacity:0;

    pointer-events:none;

    z-index:2000;

    padding:
        12px 17px;

    border-radius:10px;

    background:#18181e;

    border:
        1px solid
        rgba(255,212,0,.25);

    font-size:11px;

    font-weight:900;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.6);

    transition:.25s;
}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        padding:12px;
    }

    .header-inner{
        align-items:flex-start;
    }

    .logo{
        width:43px;
        height:43px;
        font-size:15px;
    }

    .brand h1{
        font-size:14px;
    }

    .brand p{
        font-size:9px;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        padding:9px 8px;
        font-size:9px;
    }

    .controls{
        margin-top:9px;
        padding:0 9px;
    }

    .control{
        flex-direction:column;
        align-items:stretch;
    }

    select{
        width:100%;
    }

    .progress-area{
        width:100%;
    }

    .progress{
        flex:1;
    }

    .main{
        padding:0 8px 25px;
    }

    .pitch{
        border-width:3px;
        border-radius:15px;
    }

    .position{
        width:90px;
        height:50px;
    }

    .position.empty button{
        width:48px;
        height:48px;
    }

    .plus{
        font-size:28px;
    }

    .player-name{
        font-size:8px;
        padding:6px 7px;
        border-width:1.5px;
        max-width:105px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .modal{
        padding:0;
        align-items:flex-end;
    }

    .modal-card{
        width:100%;
        max-height:92vh;

        border-radius:
            20px 20px 0 0;
    }

    .player-grid{
        grid-template-columns:1fr;
    }

}

/* ================= EXPORT ================= */

@media(min-width:601px){

    .player-name{
        font-size:10px;
    }

}

</style>
</head>

</div>

<div

</div>

</div>

</div>

/* =====================================================
   STATE
===================================================== */

let selected={};

let currentSlot=null;

let currentFilter="Tümü";

let motm="";


/* =====================================================
   FORMASYONU OLUŞTUR
===================================================== */

function renderFormation(){

    const formation=
        document.getElementById(
            "formation"
        ).value;

    const container=
        document.getElementById(
            "positions"
        );

    container.innerHTML="";

    formations[formation].forEach(
        (p,index)=>{

            const slot=
                document.createElement(
                    "div"
                );

            slot.className=
                "position empty";

            slot.id=
                "slot-"+index;

            slot.style.setProperty(
                "--x",
                p[1]+"%"
            );

            slot.style.setProperty(
                "--y",
                p[2]+"%"
            );

            slot.innerHTML=`

                <button
                    onclick="openPlayerModal(${index})"
                >

                    <span class="plus">
                        +
                    </span>

                </button>

            `;

            container.appendChild(slot);

        }
    );

}


/* =====================================================
   FORMASYON DEĞİŞTİR
===================================================== */

function changeFormation(){

    selected={};

    motm="";

    renderFormation();

    updateCounter();

    updateMOTM();

}


/* =====================================================
   MODAL
===================================================== */

function openPlayerModal(index){

    currentSlot=index;

    const formation=
        document.getElementById(
            "formation"
        ).value;

    document.getElementById(
        "modalTitle"
    ).innerText=
        formations[formation][index][0];

    document.getElementById(
        "search"
    ).value="";

    currentFilter="Tümü";

    document
        .querySelectorAll(".filter")
        .forEach(
            x=>x.classList.remove("active")
        );

    document
        .querySelector(
            '[data-filter="Tümü"]'
        )
        .classList.add("active");

    renderPlayers();

    document
        .getElementById("playerModal")
        .classList.add("show");

}

function closeModal(){

    document
        .getElementById("playerModal")
        .classList.remove("show");

}

document
    .getElementById("playerModal")
    .addEventListener(
        "click",
        e=>{

            if(
                e.target.id===
                "playerModal"
            ){

                closeModal();

            }

        }
    );


/* =====================================================
   FİLTRE
===================================================== */

function setFilter(filter,button){

    currentFilter=filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            x=>x.classList.remove("active")
        );

    button.classList.add("active");

    renderPlayers();

}


/* =====================================================
   OYUNCULARI GÖSTER
===================================================== */

function renderPlayers(){

    const grid=
        document.getElementById(
            "playerGrid"
        );

    const search=
        document.getElementById(
            "search"
        )
        .value
        .toLocaleLowerCase("tr-TR");

    grid.innerHTML="";

    players.forEach(
        (player,index)=>{

            if(
                currentFilter!=="Tümü" &&
                player.cat!==currentFilter
            ){
                return;
            }

            if(
                !player.name
                    .toLocaleLowerCase("tr-TR")
                    .includes(search)
            ){
                return;
            }

            const used=
                Object.values(selected)
                    .includes(index)
                &&
                selected[currentSlot]!==index;

            const option=
                document.createElement(
                    "button"
                );

            option.className=
                "player-option"+
                (
                    used
                    ? " used"
                    : ""
                );

            option.disabled=used;

            option.innerHTML=`

                <div class="option-avatar">
                    ${getInitials(player.name)}
                </div>

                <div>

                    <div class="option-name">
                        ${player.name}
                    </div>

                    <div class="option-pos">
                        ${player.pos}
                    </div>

                </div>

            `;

            if(!used){

                option.onclick=()=>{
                    selectPlayer(index);
                };

            }

            grid.appendChild(option);

        }
    );

}


/* =====================================================
   FUTBOLCU SEÇ
===================================================== */

function selectPlayer(playerIndex){

    selected[currentSlot]=playerIndex;

    const player=
        players[playerIndex];

    const slot=
        document.getElementById(
            "slot-"+currentSlot
        );

    slot.classList.remove("empty");

    /*
       ÖNEMLİ:
       Burada avatar YOK.
       Sadece player.name yazdırılıyor.
    */

    slot.innerHTML=`

        <button
            onclick="openPlayerModal(${currentSlot})"
            aria-label="${player.name}"
        >

            <div class="player">

                <div class="player-name">
                    ${player.name}
                </div>

            </div>

        </button>

    `;

    updateCounter();

    updateMOTM();

    highlightMOTM();

    closeModal();

}


/* =====================================================
   MAÇIN OYUNCUSU
===================================================== */

function updateMOTM(){

    const section=
        document.getElementById(
            "motmSection"
        );

    const select=
        document.getElementById(
            "motmSelect"
        );

    const selectedPlayers=
        Object.values(selected);

    if(
        selectedPlayers.length!==11
    ){

        section.classList.remove(
            "show"
        );

        motm="";

        select.value="";

        highlightMOTM();

        return;
    }

    section.classList.add(
        "show"
    );

    select.innerHTML=`

        <option value="">
            ⭐ Maçın oyuncusunu seç
        </option>

    `;

    selectedPlayers.forEach(
        index=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=index;

            option.textContent=
                players[index].name;

            if(
                String(index)===
                String(motm)
            ){
                option.selected=true;
            }

            select.appendChild(option);

        }
    );

}


/* =====================================================
   MAÇIN OYUNCUSUNU SEÇ
===================================================== */

function selectMOTM(){

    motm=
        document.getElementById(
            "motmSelect"
        ).value;

    highlightMOTM();

}


/* =====================================================
   YILDIZ
===================================================== */

function highlightMOTM(){

    document
        .querySelectorAll(
            ".motm-star"
        )
        .forEach(
            star=>star.remove()
        );

    if(
        motm===""
    ){
        return;
    }

    Object.keys(selected).forEach(
        slotIndex=>{

            if(
                String(
                    selected[slotIndex]
                )===
                String(motm)
            ){

                const slot=
                    document.getElementById(
                        "slot-"+slotIndex
                    );

                const star=
                    document.createElement(
                        "div"
                    );

                star.className=
                    "motm-star";

                star.innerText="⭐";

                slot.appendChild(star);

            }

        }
    );

}


/* =====================================================
   İSİM İÇİN KULLANILAN MODAL HARFLERİ
   SAHADA KULLANILMIYOR
===================================================== */

function getInitials(name){

    const parts=
        name.trim().split(" ");

    if(
        parts.length===1
    ){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }

    return (
        parts[0][0]+
        parts[parts.length-1][0]
    ).toUpperCase();

}


/* =====================================================
   SAYAC
===================================================== */

function updateCounter(){

    const count=
        Object.keys(selected).length;

    document.getElementById(
        "counter"
    ).innerText=
        count+
        " / 11 oyuncu";

    document.getElementById(
        "progressBar"
    ).style.width=
        (
            count/11*100
        )+
        "%";

    if(
        count===11
    ){

        updateMOTM();

    }

}


/* =====================================================
   SIFIRLA
===================================================== */

function resetSquad(){

    selected={};

    motm="";

    renderFormation();

    updateCounter();

    updateMOTM();

    toast(
        "Kadro sıfırlandı."
    );

}


/* =====================================================
   GÖRSEL KAYDET
===================================================== */

async function saveImage(){

    if(
        Object.keys(selected).length!==11
    ){

        toast(
            "Önce 11 oyuncuyu tamamla."
        );

        return;
    }

    if(
        motm===""
    ){

        toast(
            "Önce maçın oyuncusunu seç."
        );

        document
            .getElementById(
                "motmSelect"
            )
            .focus();

        return;
    }

    const pitch=
        document.getElementById(
            "pitch"
        );

    toast(
        "Görsel hazırlanıyor..."
    );

    try{

        const canvas=
            await html2canvas(
                pitch,
                {
                    scale:3,
                    useCORS:true,
                    backgroundColor:null,
                    logging:false
                }
            );

        const link=
            document.createElement(
                "a"
            );

        const formation=
            document
                .getElementById(
                    "formation"
                )
                .value
                .replaceAll(
                    "-",
                    "_"
                );

        link.download=
            "GALATASARAY-KADRO-"+
            formation+
            ".png";

        link.href=
            canvas.toDataURL(
                "image/png"
            );

        link.click();

        toast(
            "Görsel kaydedildi! 📸"
        );

    }
    catch(error){

        console.error(error);

        toast(
            "Görsel oluşturulamadı."
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(message){

    const element=
        document.getElementById(
            "toast"
        );

    element.innerText=message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer=
        setTimeout(
            ()=>{
                element.classList.remove(
                    "show"
                );
            },
            2500
        );

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            closeModal();

        }

    }
);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

renderFormation();

updateCounter();

</script>
