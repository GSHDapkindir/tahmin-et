<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Skor Tahmin - Galatasaray vs Barcelona</title>
    <!-- Font & Icon Library -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML2Canvas Library for Screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f0f15;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 215, 0, 0.3);
            --accent-gold: #ffd700;
            --gs-red: #a90429;
            --barca-blue: #004d98;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f15 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .vip-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .vip-badge {
            position: absolute;
            top: 15px;
            right: -35px;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 25px;
        }

        .match-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .gs-logo { background: linear-gradient(135deg, #a90429, #fdb913); }
        .barca-logo { background: linear-gradient(135deg, #004d98, #a50044); }

        .team-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .score-display {
            width: 75px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 12px;
            color: var(--accent-gold);
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: border-color 0.3s;
        }

        .score-display.spinning {
            color: #888;
            animation: pulseGlow 0.2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { border-color: rgba(255, 215, 0, 0.2); }
            to { border-color: var(--accent-gold); }
        }

        .vs {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-gold);
            padding: 0 10px;
        }

        .comment-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-gold);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            min-width: 140px;
        }

        .btn-predict {
            background: linear-gradient(45deg, #00C853, #64DD17);
            color: #000;
            font-weight: 800;
        }

        .btn-predict:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-telegram {
            background: #0088cc;
            color: white;
        }

        .btn-telegram:hover {
            background: #006699;
            transform: translateY(-2px);
        }

        .btn-download {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="vip-card" id="captureCard">
        <div class="vip-badge">VIP TAHMİN</div>
        
        <div class="header">
            <h1>DEV EŞLEŞME</h1>
            <p>Otomatik Skor Çarkını Durdur, Kaderini Belirle!</p>
        </div>

        <div class="match-container">
            <!-- GALATASARAY -->
            <div class="team">
                <div class="team-logo gs-logo">GS</div>
                <div class="team-name">Galatasaray</div>
                <div id="gsScore" class="score-display">2</div>
            </div>

            <div class="vs">VS</div>

            <!-- BARCELONA -->
            <div class="team">
                <div class="team-logo barca-logo">BAR</div>
                <div class="team-name">Barcelona</div>
                <div id="barcaScore" class="score-display">1</div>
            </div>
        </div>

        <!-- MİZAHİ YORUM ALANI -->
        <div class="comment-box" id="commentText">
            "Yorum bekleniyor..."
        </div>

        <!-- BUTONLAR -->
        <div class="btn-group" data-html2canvas-ignore="true">
            <button class="btn btn-predict" id="spinBtn" onclick="toggleSpin()">
                <i class="fa-solid fa-dice"></i> Skorları Dönüştür / Durdur
            </button>
            <button class="btn btn-telegram" onclick="shareTelegram()">
                <i class="fa-brands fa-telegram"></i> Telegram'da Paylaş
            </button>
            <button class="btn btn-download" onclick="downloadImage()">
                <i class="fa-solid fa-camera"></i> Resim Olarak Kaydet
            </button>
        </div>
    </div>

    <script>
        // GALATASARAY GALİBİYETİ YORUMLARI
        const gsComments = [
            "RAMS Park'ta uzay takımı gelse söker atar! Aslan kükredi bir kere! 🦁",
            "Camp Nou yetkilileri ne olduğunu anlamadan İstanbul uçak biletlerini kontrol ediyor...",
            "Barcelona otobüsünü Florya kavşağında durdurup tebrik çiçeği verdiler!",
            "Taktik maktik yok, bam bam bam! Tiki-taka buraya kadar!",
            "İspanyollar paella yemeyi bıraktı, baklava siparişi veriyor!",
            "Katalan basını şokta: 'İstanbul'da kaybolduk, pusulamız bozuldu!'",
            "Osimhen ve Rafa Leao gol şov yaptı, Barcelona defansı tatile erken çıktı!",
            "Boğaz'ın kırmızı-sarı suları Barcelona'yı yuttu!",
            "Avrupa Fatihi genleri devreye girdi, Katalanlar şaşkın!",
            "Katalonya'da hüzün hakim: 'Biz neye uğradık böyle?'"
        ];

        // BARCELONA GALİBİYETİ YORUMLARI
        const barcaComments = [
            "Tiki-taka İstanbul sahillerine kadar indi, bu skor can yakar...",
            "Barça uzay futbolu oynadı, bizimkiler uzaydan gelen topu izledi.",
            "Flick maçı izlerken kahvesini yudumladı, tıkır tıkır galibiyet.",
            "Skor panosu bozulmadıysa Barcelona şov yapmış demektir...",
            "İspanyol rüzgarı sert esti, kalecimizin eldivenleri buharlaştı!",
            "Pas yüzdesi %98 olunca top bize hiç gelmedi desek yeridir...",
            "Barcelona taktiği çözülemedi, UEFA araya girdi sanırım!",
            "Katalanlar şovunu yaptı, İstanbul'dan 3 puanla döndü.",
            "Işıklar kapandı, Barcelona geceyi aydınlattı...",
            "Saha ortasında tiki-taka dersi verildi, ders ücreti skor panosunda!"
        ];

        // BERABERLİK YORUMLARI
        const drawComments = [
            "Dostluk kazandı ama iki tarafın da kalbi duruyordu! Harika bir maç!",
            "Şampiyonlar Ligi kalitesinde bir beraberlik! Kimse üzülmedi.",
            "Tiki-taka ile Bam-Bam-Bam çakıştı, nötr alan oluştu! 0x0 etki.",
            "İki dev yenişemedi, rövanş maçı sinemalarda!",
            "Ne Aslan pes etti ne de Katalanlar! Sonuç: Kardeşlik berabere.",
            "90 dakika boyunca iki taraf da ne var ne yok sahaya döktü!",
            "Her iki teknik direktör de maç sonu el sıkışıp helalleşti.",
            "Direkler sallandı, kaleciler devleşti, maç berabere bitti!",
            "İki takım da birer puanı cebine koydu, dostça ayrıldı.",
            "Ne Katalunya güldü ne de İstanbul, tam bir taktik savaşı!"
        ];

        // ÇOK GOLLÜ MAÇ YORUMLARI (+7 Gol)
        const crazyComments = [
            "Bu skor halı sahada bile çıkmaz! FIFA oynasalar bu kadar gol olmazdı!",
            "Defanslar maça gelmeyi unuttu sanırım, kaleciler istifasını verdi!",
            "Tarihe geçecek bir tenis maçı skoru! Seyirciler ayakta alkışlıyor!",
            "Hakem düdüğü çalmaktan yoruldu, basketbol skoru gibi maç!",
            "Saha çizgisini çekmeyi unutmuşlar, her gelen şut gol oldu!"
        ];

        let isSpinning = false;
        let spinInterval;
        let currentGs = 2;
        let currentBarca = 1;

        function toggleSpin() {
            const spinBtn = document.getElementById('spinBtn');
            const gsBox = document.getElementById('gsScore');
            const barcaBox = document.getElementById('barcaScore');
            const commentBox = document.getElementById('commentText');

            if (!isSpinning) {
                isSpinning = true;
                spinBtn.innerHTML = '<i class="fa-solid fa-hand"></i> Skoru Durdur!';
                spinBtn.style.background = 'linear-gradient(45deg, #D50000, #FF1744)';
                gsBox.classList.add('spinning');
                barcaBox.classList.add('spinning');
                commentBox.innerText = '"Top kapışılıyor, skorlar hızla değişiyor..."';

                spinInterval = setInterval(() => {
                    currentGs = Math.floor(Math.random() * 6); // 0-5 arası
                    currentBarca = Math.floor(Math.random() * 6);
                    gsBox.innerText = currentGs;
                    barcaBox.innerText = currentBarca;
                }, 80);
            } else {
                clearInterval(spinInterval);
                isSpinning = false;
                gsBox.classList.remove('spinning');
                barcaBox.classList.remove('spinning');
                spinBtn.innerHTML = '<i class="fa-solid fa-dice"></i> Tekrar Çevir';
                spinBtn.style.background = 'linear-gradient(45deg, #00C853, #64DD17)';

                updateComment(currentGs, currentBarca);
            }
        }

        function updateComment(gs, barca) {
            const commentBox = document.getElementById('commentText');
            let comment = "";

            if (gs + barca > 7) {
                comment = crazyComments[Math.floor(Math.random() * crazyComments.length)];
            } else if (gs > barca) {
                comment = gsComments[Math.floor(Math.random() * gsComments.length)];
            } else if (barca > gs) {
                comment = barcaComments[Math.floor(Math.random() * barcaComments.length)];
            } else {
                comment = drawComments[Math.floor(Math.random() * drawComments.length)];
            }

            commentBox.innerText = `"${comment}"`;
        }

        function shareTelegram() {
            if (isSpinning) {
                alert("Önce skoru durdurmalısın!");
                return;
            }
            const comment = document.getElementById('commentText').innerText;

            const text = `🔥 *VIP SKOR TAHMİNİ* 🔥\n\n🏆 *Galatasaray* ${currentGs} - ${currentBarca} *Barcelona*\n\n💬 *Analiz:* ${comment}\n\nSen de tahminini yap!`;
            const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
            
            window.open(telegramUrl, '_blank');
        }

        function downloadImage() {
            if (isSpinning) {
                alert("Önce skoru durdurmalısın!");
                return;
            }
            const card = document.getElementById('captureCard');
            
            html2canvas(card, {
                backgroundColor: null,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'GS-BARCA-VIP-Tahmin.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = () => {
            updateComment(currentGs, currentBarca);
        };
    </script>
</body>
</html>
