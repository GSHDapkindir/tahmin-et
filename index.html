<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Skor Tahmin - Galatasaray vs Barcelona</title>
    <!-- Font & Icon Library -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML2Canvas Library for Screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --accent-gold: #ffd700;
            --gs-red: #d50000;
            --gs-yellow: #fdb913;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #600010 0%, #2a0005 60%, #0d0002 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .vip-card {
            background: rgba(25, 3, 7, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--gs-yellow);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(253, 185, 19, 0.2);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .vip-badge {
            position: absolute;
            top: 18px;
            right: -35px;
            background: linear-gradient(45deg, var(--gs-yellow), var(--accent-gold));
            color: #000;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .header h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, var(--gs-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .header p {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 25px;
        }

        .match-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .gs-logo { background: linear-gradient(135deg, #a90429, #fdb913); }
        .barca-logo { background: linear-gradient(135deg, #004d98, #a50044); }

        .team-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        /* SARI - KIRMIZI SPINNER KUTULARI */
        .score-display {
            width: 75px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--gs-yellow);
            border-radius: 12px;
            color: var(--gs-yellow);
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
            transition: all 0.3s ease;
        }

        /* DÖNÜŞ ANINDA SARI VE KIRMIZI YANIP SÖNME */
        .score-display.spin-yellow {
            border-color: var(--gs-yellow) !important;
            color: var(--gs-yellow) !important;
            box-shadow: 0 0 15px var(--gs-yellow);
        }

        .score-display.spin-red {
            border-color: var(--gs-red) !important;
            color: var(--gs-red) !important;
            box-shadow: 0 0 15px var(--gs-red);
        }

        .vs {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--gs-yellow);
            padding: 0 10px;
        }

        /* MAÇ ANALİZİ KUTUSU */
        .analysis-wrapper {
            background: rgba(10, 1, 3, 0.6);
            border: 1px solid rgba(253, 185, 19, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .analysis-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--gs-yellow);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comment-box {
            font-style: italic;
            font-size: 0.9rem;
            color: #f0f0f0;
            line-height: 1.4;
            min-height: 45px;
            display: flex;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            min-width: 120px;
        }

        .btn-predict {
            background: linear-gradient(45deg, var(--gs-yellow), #ffa500);
            color: #000;
        }

        .btn-predict:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-telegram {
            background: #0088cc;
            color: white;
        }

        .btn-telegram:hover {
            background: #006699;
            transform: translateY(-2px);
        }

        .btn-download {
            background: linear-gradient(45deg, #2e7d32, #4caf50);
            color: #fff;
        }

        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="vip-card" id="captureCard">
        <div class="vip-badge" data-html2canvas-ignore="true">TAHMİN</div>
        
        <div class="header">
            <h1>DEV EŞLEŞME</h1>
            <p data-html2canvas-ignore="true">Galatasaray x Barcelona Tahmin Ekranı</p>
        </div>

        <div class="match-container">
            <!-- GALATASARAY -->
            <div class="team">
                <div class="team-logo gs-logo">GS</div>
                <div class="team-name">Galatasaray</div>
                <div id="gsScore" class="score-display">?</div>
            </div>

            <div class="vs">VS</div>

            <!-- BARCELONA -->
            <div class="team">
                <div class="team-logo barca-logo">BAR</div>
                <div class="team-name">Barcelona</div>
                <div id="barcaScore" class="score-display">?</div>
            </div>
        </div>

        <!-- MAÇ ANALİZİ KUTUSU -->
        <div class="analysis-wrapper">
            <div class="analysis-title">
                <i class="fa-solid fa-chart-line"></i> Maç Analizi
            </div>
            <div class="comment-box" id="commentText">
                "Skoru belirlemek için aşağıdaki butona basın!"
            </div>
        </div>

        <!-- BUTONLAR (Görsel kaydedilirken/paylaşılırken görünmez) -->
        <div class="btn-group" data-html2canvas-ignore="true">
            <button class="btn btn-predict" id="spinBtn" onclick="toggleSpin()">
                <i class="fa-solid fa-dice"></i> Skoru Belirle
            </button>
            <button class="btn btn-telegram" onclick="shareTelegram()">
                <i class="fa-brands fa-telegram"></i> Paylaş
            </button>
            <button class="btn btn-download" onclick="downloadImage()">
                <i class="fa-solid fa-camera"></i> Kaydet
            </button>
        </div>
    </div>

    <script>
        // MİZAHİ YORUM LİSTELERİ
        const gsComments = [
            "RAMS Park'ta uzay takımı gelse söker atar! Aslan kükredi bir kere! 🦁",
            "Camp Nou yetkilileri ne olduğunu anlamadan İstanbul uçak biletlerini kontrol ediyor...",
            "Barcelona otobüsünü Florya kavşağında durdurup tebrik çiçeği verdiler!",
            "Taktik maktik yok, bam bam bam! Tiki-taka buraya kadar!",
            "İspanyollar paella yemeyi bıraktı, baklava siparişi veriyor!",
            "Katalan basını şokta: 'İstanbul'da kaybolduk, pusulamız bozuldu!'",
            "Osimhen gol şov yaptı, Barcelona defansı tatile erken çıktı!",
            "Boğaz'ın kırmızı-sarı suları Barcelona'yı yuttu!",
            "Avrupa Fatihi genleri devreye girdi, Katalanlar şaşkın!"
        ];

        const barcaComments = [
            "Tiki-taka İstanbul sahillerine kadar indi, bu skor can yakar...",
            "Barça uzay futbolu oynadı, bizimkiler uzaydan gelen topu izledi.",
            "Flick maçı izlerken kahvesini yudumladı, tıkır tıkır galibiyet.",
            "Skor panosu bozulmadıysa Barcelona şov yapmış demektir...",
            "İspanyol rüzgarı sert esti, kalecimizin eldivenleri buharlaştı!",
            "Pas yüzdesi %98 olunca top bize hiç gelmedi desek yeridir...",
            "Barcelona taktiği çözülemedi, UEFA araya girdi sanırım!"
        ];

        const drawComments = [
            "Dostluk kazandı ama iki tarafın da kalbi duruyordu! Harika bir maç!",
            "Şampiyonlar Ligi kalitesinde bir beraberlik! Kimse üzülmedi.",
            "Tiki-taka ile Bam-Bam-Bam çakıştı, nötr alan oluştu!",
            "İki dev yenişemedi, rövanş maçı sinemalarda!",
            "Ne Aslan pes etti ne de Katalanlar! Sonuç: Kardeşlik berabere.",
            "90 dakika boyunca iki taraf da ne var ne yok sahaya döktü!"
        ];

        const crazyComments = [
            "Bu skor halı sahada bile çıkmaz! FIFA oynasalar bu kadar gol olmazdı!",
            "Defanslar maça gelmeyi unuttu sanırım, kaleciler istifasını verdi!",
            "Tarihe geçecek bir tenis maçı skoru! Seyirciler ayakta alkışlıyor!"
        ];

        let isSpinning = false;
        let spinInterval;
        let currentGs = null;
        let currentBarca = null;

        function toggleSpin() {
            const spinBtn = document.getElementById('spinBtn');
            const gsBox = document.getElementById('gsScore');
            const barcaBox = document.getElementById('barcaScore');
            const commentBox = document.getElementById('commentText');

            if (!isSpinning) {
                isSpinning = true;
                spinBtn.innerHTML = '<i class="fa-solid fa-hand"></i> Skoru Durdur!';
                spinBtn.style.background = 'linear-gradient(45deg, #D50000, #FF1744)';
                spinBtn.style.color = '#fff';

                // Bir taraf Sarı, Bir taraf Kırmızı efekt
                gsBox.classList.add('spin-yellow');
                barcaBox.classList.add('spin-red');

                commentBox.innerText = '"Kader belirleniyor, skorlar dönüyor..."';

                spinInterval = setInterval(() => {
                    currentGs = Math.floor(Math.random() * 5); // 0-4 arası
                    currentBarca = Math.floor(Math.random() * 5);
                    gsBox.innerText = currentGs;
                    barcaBox.innerText = currentBarca;
                }, 70);
            } else {
                clearInterval(spinInterval);
                isSpinning = false;

                gsBox.classList.remove('spin-yellow');
                barcaBox.classList.remove('spin-red');

                spinBtn.innerHTML = '<i class="fa-solid fa-dice"></i> Yeniden Belirle';
                spinBtn.style.background = 'linear-gradient(45deg, var(--gs-yellow), #ffa500)';
                spinBtn.style.color = '#000';

                updateComment(currentGs, currentBarca);
            }
        }

        function updateComment(gs, barca) {
            const commentBox = document.getElementById('commentText');
            let comment = "";

            if (gs + barca >= 7) {
                comment = crazyComments[Math.floor(Math.random() * crazyComments.length)];
            } else if (gs > barca) {
                comment = gsComments[Math.floor(Math.random() * gsComments.length)];
            } else if (barca > gs) {
                comment = barcaComments[Math.floor(Math.random() * barcaComments.length)];
            } else {
                comment = drawComments[Math.floor(Math.random() * drawComments.length)];
            }

            commentBox.innerText = `"${comment}"`;
        }

        function shareTelegram() {
            if (currentGs === null || isSpinning) {
                alert("Önce skoru belirlemelisiniz!");
                return;
            }
            const comment = document.getElementById('commentText').innerText;

            const text = `🔥 *GALATASARAY vs BARCELONA* 🔥\n\n🏆 *Skor:* Galatasaray ${currentGs} - ${currentBarca} Barcelona\n\n💬 *Maç Analizi:* ${comment}\n\nSen de tahminini yap!`;
            const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
            
            window.open(telegramUrl, '_blank');
        }

        function downloadImage() {
            if (currentGs === null || isSpinning) {
                alert("Önce skoru belirlemelisiniz!");
                return;
            }
            const card = document.getElementById('captureCard');
            
            html2canvas(card, {
                backgroundColor: null,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'GS-BARCA-Tahmin.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
