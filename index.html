<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#a40000;
    --red-dark:#650000;
    --red-light:#d90000;

    --yellow:#ffd400;
    --yellow-light:#fff09a;

    --black:#060608;
    --panel:#111116;

    --text:#ffffff;
    --muted:#92949d;
}

html{
    background:#060608;
}

body{
    min-height:100vh;

    color:var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(
            circle at 5% 0%,
            rgba(170,0,0,.30),
            transparent 30%
        ),

        radial-gradient(
            circle at 95% 100%,
            rgba(255,212,0,.10),
            transparent 30%
        ),

        #060608;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:relative;

    padding:16px;

    background:

        linear-gradient(
            135deg,
            #09090c,
            #17171d
        );

    border-bottom:
        1px solid
        rgba(255,212,0,.18);

    box-shadow:
        0 12px 45px
        rgba(0,0,0,.65);

}

.header:after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            var(--yellow),
            var(--red),
            transparent
        );

}

.header-inner{

    max-width:1200px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}

.brand{

    display:flex;

    align-items:center;

    gap:12px;

}

.logo{

    width:54px;
    height:54px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:17px;

    font-weight:1000;

    color:#fff;

    background:

        radial-gradient(
            circle at 35% 25%,
            #dc0000,
            #8c0000 65%,
            #4e0000
        );

    border:
        3px solid
        var(--yellow);

    box-shadow:

        0 0 20px
        rgba(255,212,0,.35),

        inset 0 0 15px
        rgba(255,255,255,.1);

}

.brand h1{

    font-size:19px;

    font-weight:1000;

    letter-spacing:.3px;

}

.brand p{

    margin-top:4px;

    color:var(--muted);

    font-size:10px;

    font-weight:700;

}

.actions{

    display:flex;

    gap:8px;

}

.btn{

    border:0;

    border-radius:10px;

    padding:11px 14px;

    color:#fff;

    font-size:10px;

    font-weight:1000;

    cursor:pointer;

    transition:.2s;

}

.btn:hover{
    transform:translateY(-2px);
}

.save{

    background:
        linear-gradient(
            135deg,
            #a40000,
            #e00000
        );

    box-shadow:
        0 7px 25px
        rgba(190,0,0,.35);

}

.reset{

    background:
        linear-gradient(
            135deg,
            #25252b,
            #17171c
        );

    border:
        1px solid
        rgba(255,255,255,.08);

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    max-width:1200px;

    margin:16px auto 10px;

    padding:0 15px;

}

.control{

    padding:11px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    background:

        linear-gradient(
            135deg,
            rgba(22,22,28,.98),
            rgba(11,11,15,.98)
        );

    border:
        1px solid
        rgba(255,212,0,.13);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.3);

}

select{

    background:
        linear-gradient(
            135deg,
            #292930,
            #17171c
        );

    color:#fff;

    border:
        1px solid
        rgba(255,212,0,.25);

    border-radius:10px;

    padding:11px 14px;

    font-size:11px;

    font-weight:1000;

    outline:none;

}

.progress-area{

    display:flex;

    align-items:center;

    gap:9px;

    color:#aaa;

    font-size:10px;

    font-weight:900;

}

.progress{

    width:140px;

    height:7px;

    overflow:hidden;

    border-radius:20px;

    background:#292930;

}

.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            var(--red),
            var(--yellow)
        );

    box-shadow:
        0 0 12px
        rgba(255,212,0,.45);

    transition:.35s;

}


/* =========================================================
   MAIN
========================================================= */

.main{

    padding:
        0 15px 45px;

}

.pitch-wrap{

    width:100%;

    max-width:760px;

    margin:auto;

}


/* =========================================================
   VIP PITCH
========================================================= */

.pitch{

    position:relative;

    width:100%;

    aspect-ratio:1 / 1.43;

    overflow:hidden;

    border-radius:24px;

    border:
        4px solid
        #ffe66d;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(170,0,0,.18) 0px,
            rgba(170,0,0,.18) 70px,

            rgba(255,212,0,.055) 70px,
            rgba(255,212,0,.055) 140px
        ),

        linear-gradient(
            145deg,
            #720707,
            #a90808 35%,
            #700606 68%,
            #b30a0a
        );

    box-shadow:

        0 35px 90px
        rgba(0,0,0,.72),

        inset 0 0 120px
        rgba(0,0,0,.38),

        0 0 45px
        rgba(255,212,0,.12);

}

.pitch:before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,240,120,.18),
            transparent 43%
        );

    pointer-events:none;

}

.pitch:after{

    content:"GALATASARAY";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-90deg);

    font-size:70px;

    font-weight:1000;

    letter-spacing:8px;

    color:
        rgba(255,235,100,.035);

    pointer-events:none;

}


/* =========================================================
   PITCH LINES
========================================================= */

.line{

    position:absolute;

    border:
        2px solid
        rgba(255,235,120,.78);

    pointer-events:none;

}

.half{

    width:100%;
    height:0;

    left:0;
    top:50%;

}

.circle{

    width:25%;

    aspect-ratio:1;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

}

.dot{

    position:absolute;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ffe96a;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    box-shadow:
        0 0 12px
        rgba(255,212,0,.7);

}

.penalty{

    position:absolute;

    width:48%;
    height:18%;

    left:26%;

    border:
        2px solid
        rgba(255,235,120,.78);

}

.penalty.top{

    top:0;

    border-top:0;

}

.penalty.bottom{

    bottom:0;

    border-bottom:0;

}

.goal{

    position:absolute;

    width:18%;
    height:6%;

    left:41%;

    border:
        2px solid
        rgba(255,235,120,.78);

}

.goal.top{

    top:0;

    border-top:0;

}

.goal.bottom{

    bottom:0;

    border-bottom:0;

}


/* =========================================================
   POSITION
========================================================= */

.position{

    position:absolute;

    left:var(--x);
    top:var(--y);

    transform:
        translate(-50%,-50%);

    width:170px;

    height:70px;

    z-index:30;

}

.position button{

    width:100%;
    height:100%;

    border:0;

    padding:0;

    background:transparent;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* =========================================================
   EMPTY PLUS
========================================================= */

.position.empty button{

    width:62px;
    height:62px;

    margin:auto;

    border-radius:50%;

    border:
        3px solid
        var(--yellow);

    background:

        radial-gradient(
            circle,
            rgba(255,212,0,.28),
            rgba(135,0,0,.9)
        );

    box-shadow:

        0 0 0 6px
        rgba(255,212,0,.08),

        0 0 30px
        rgba(255,212,0,.58),

        0 10px 25px
        rgba(0,0,0,.6);

    animation:
        vipPulse 1.8s infinite;

}

.plus{

    font-size:35px;

    line-height:1;

    font-weight:300;

    color:#fff;

}

@keyframes vipPulse{

    0%,100%{

        box-shadow:

            0 0 0 5px
            rgba(255,212,0,.08),

            0 0 20px
            rgba(255,212,0,.35);

    }

    50%{

        box-shadow:

            0 0 0 10px
            rgba(255,212,0,.035),

            0 0 40px
            rgba(255,212,0,.8);

    }

}


/* =========================================================
   PLAYER
   SADECE İSİM
========================================================= */

.player{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

}

.player-name{

    position:relative;

    display:block;

    max-width:100%;

    padding:
        10px 15px;

    border-radius:10px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    color:#fff;

    font-size:15px;

    line-height:1;

    font-weight:1000;

    letter-spacing:.15px;

    text-align:center;

    background:

        linear-gradient(
            135deg,
            #8b0000 0%,
            #c50000 50%,
            #8c0000 100%
        );

    border:
        2px solid
        #ffe15c;

    box-shadow:

        0 8px 22px
        rgba(0,0,0,.7),

        0 0 18px
        rgba(255,212,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.15);

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.8);

    transition:.2s;

}

.player-name:before{

    content:"";

    position:absolute;

    left:10px;
    right:10px;
    top:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.7),
            transparent
        );

}

.position:hover .player-name{

    transform:
        scale(1.06);

    box-shadow:

        0 10px 28px
        rgba(0,0,0,.8),

        0 0 30px
        rgba(255,212,0,.45);

}


/* =========================================================
   MVP
========================================================= */

.motm-section{

    display:none;

    margin-top:16px;

}

.motm-section.show{

    display:block;

}

.motm-card{

    padding:17px;

    border-radius:16px;

    background:

        linear-gradient(
            135deg,
            rgba(35,8,8,.98),
            rgba(15,15,20,.98)
        );

    border:
        1px solid
        rgba(255,212,0,.3);

    box-shadow:

        0 15px 45px
        rgba(0,0,0,.5),

        inset 0 1px 0
        rgba(255,255,255,.04);

}

.motm-title{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:15px;

    font-weight:1000;

}

.motm-title span{

    font-size:19px;

}

.motm-sub{

    margin-top:5px;

    color:#888b94;

    font-size:10px;

}

.motm-select{

    width:100%;

    margin-top:12px;

    padding:13px;

    border-radius:11px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #28282f,
            #15151a
        );

    border:
        1px solid
        rgba(255,212,0,.25);

}


/* =========================================================
   MVP STAR
========================================================= */

.motm-star{

    position:absolute;

    top:-18px;
    right:5px;

    z-index:100;

    font-size:25px;

    filter:
        drop-shadow(
            0 3px 5px #000
        );

    animation:
        starPulse 1.4s infinite;

}

@keyframes starPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.82);

    backdrop-filter:
        blur(12px);

    z-index:1000;

}

.modal.show{

    display:flex;

}

.modal-card{

    width:min(700px,100%);

    max-height:90vh;

    overflow:hidden;

    border-radius:21px;

    background:

        linear-gradient(
            145deg,
            #15151b,
            #08080b
        );

    border:
        1px solid
        rgba(255,212,0,.25);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.9);

}

.modal-header{

    padding:18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}

.modal-title{

    font-size:18px;

    font-weight:1000;

}

.modal-sub{

    margin-top:4px;

    color:#858891;

    font-size:10px;

}

.close{

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:#28282e;

    color:#fff;

    font-size:21px;

    cursor:pointer;

}

.modal-content{

    padding:15px;

    max-height:
        calc(90vh - 75px);

    overflow-y:auto;

}

.search{

    width:100%;

    padding:14px;

    margin-bottom:12px;

    border-radius:11px;

    color:#fff;

    background:#202027;

    border:
        1px solid
        rgba(255,212,0,.17);

    outline:none;

    font-size:12px;

}

.filters{

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:3px;

    margin-bottom:12px;

}

.filter{

    flex:none;

    padding:9px 13px;

    border:0;

    border-radius:9px;

    background:#25252b;

    color:#999ca5;

    font-size:10px;

    font-weight:1000;

    cursor:pointer;

}

.filter.active{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #a40000,
            #db0000
        );

    box-shadow:
        0 5px 15px
        rgba(180,0,0,.3);

}

.player-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:8px;

}

.player-option{

    min-height:64px;

    padding:11px;

    display:flex;

    align-items:center;

    gap:10px;

    border-radius:11px;

    color:#fff;

    text-align:left;

    background:
        linear-gradient(
            135deg,
            #1e1e25,
            #15151a
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    cursor:pointer;

    transition:.2s;

}

.player-option:hover{

    transform:
        translateY(-2px);

    border-color:
        rgba(255,212,0,.42);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.35);

}

.player-option.used{

    opacity:.22;

    cursor:not-allowed;

}

.option-avatar{

    width:43px;
    height:43px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#fff;

    font-size:10px;

    font-weight:1000;

    background:
        linear-gradient(
            135deg,
            #a40000,
            #df0000,
            #d9b900
        );

    border:
        2px solid
        #ffe05a;

}

.option-name{

    font-size:12px;

    font-weight:1000;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.option-pos{

    margin-top:3px;

    color:#858891;

    font-size:9px;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;
    bottom:25px;

    z-index:2000;

    padding:
        12px 18px;

    border-radius:10px;

    color:#fff;

    background:#18181e;

    border:
        1px solid
        rgba(255,212,0,.28);

    font-size:11px;

    font-weight:1000;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,25px);

    transition:.25s;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.6);

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{

        padding:12px;

    }

    .header-inner{

        align-items:flex-start;

    }

    .logo{

        width:44px;
        height:44px;

        font-size:14px;

    }

    .brand h1{

        font-size:14px;

    }

    .brand p{

        font-size:8px;

    }

    .actions{

        flex-direction:column;

    }

    .btn{

        padding:
            9px 8px;

        font-size:8px;

    }

    .controls{

        padding:
            0 9px;

        margin-top:9px;

    }

    .control{

        flex-direction:column;

        align-items:stretch;

    }

    select{

        width:100%;

    }

    .progress-area{

        width:100%;

    }

    .progress{

        flex:1;

    }

    .main{

        padding:
            0 7px 30px;

    }

    .pitch{

        border-width:3px;

        border-radius:17px;

    }

    .pitch:after{

        font-size:38px;

    }

    .position{

        width:125px;

        height:58px;

    }

    .position.empty button{

        width:49px;
        height:49px;

    }

    .plus{

        font-size:29px;

    }

    .player-name{

        max-width:125px;

        padding:
            8px 9px;

        font-size:10px;

        border-width:1.5px;

    }

    .motm-card{

        padding:14px;

    }

    .player-grid{

        grid-template-columns:1fr;

    }

    .modal{

        padding:0;

        align-items:flex-end;

    }

    .modal-card{

        width:100%;

        max-height:93vh;

        border-radius:
            20px 20px 0 0;

    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .position{

        width:108px;

    }

    .player-name{

        max-width:108px;

        font-size:8px;

        padding:
            7px 7px;

    }

}

</style>
</head>

/* =========================================================

========================================================= */

function renderFormation(){

    const formation=
        document.getElementById(
            "formation"
        ).value;

    const container=
        document.getElementById(
            "positions"
        );

    container.innerHTML="";

    formations[formation].forEach(
        (p,index)=>{

            const slot=
                document.createElement(
                    "div"
                );

            slot.className=
                "position empty";

            slot.id=
                "slot-"+index;

            slot.style.setProperty(
                "--x",
                p[1]+"%"
            );

            slot.style.setProperty(
                "--y",
                p[2]+"%"
            );

            slot.innerHTML=`

                <button
                    onclick="openPlayerModal(${index})"
                    aria-label="${p[0]} seç"
                >

                    <span class="plus">
                        +
                    </span>

                </button>

            `;

            container.appendChild(slot);

        }
    );

}

function openPlayerModal(index){

    currentSlot=index;

    const formation=
        document.getElementById(
            "formation"
        ).value;

    document.getElementById(
        "modalTitle"
    ).innerText=
        formations[formation][index][0];

    document.getElementById(
        "search"
    ).value="";

    currentFilter="Tümü";

    document
        .querySelectorAll(".filter")
        .forEach(
            button=>
                button.classList.remove(
                    "active"
                )
        );

    document
        .querySelector(
            '[data-filter="Tümü"]'
        )
        .classList.add("active");

    renderPlayers();

    document
        .getElementById(
            "playerModal"
        )
        .classList.add("show");

}

function closeModal(){

    document
        .getElementById(
            "playerModal"
        )
        .classList.remove("show");

}

    filter,
    button
){

    currentFilter=filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            x=>
                x.classList.remove(
                    "active"
                )
        );

    button.classList.add("active");

    renderPlayers();

}


/* =========================================================
   PLAYER LIST
========================================================= */

function renderPlayers(){

    const grid=
        document.getElementById(
            "playerGrid"
        );

    const search=
        document.getElementById(
            "search"
        )
        .value
        .toLocaleLowerCase(
            "tr-TR"
        );

    grid.innerHTML="";

    players.forEach(
        (player,index)=>{

            if(
                currentFilter!=="Tümü"
                &&
                player.cat!==currentFilter
            ){

                return;

            }

            if(
                !player.name
                    .toLocaleLowerCase(
                        "tr-TR"
                    )
                    .includes(
                        search
                    )
            ){

                return;

            }

            const used=
                Object
                    .values(selected)
                    .includes(index)
                &&
                selected[currentSlot]!==index;

            const option=
                document.createElement(
                    "button"
                );

            option.className=
                "player-option"+
                (
                    used
                    ? " used"
                    : ""
                );

            option.disabled=used;

            option.innerHTML=`

                <div class="option-avatar">
                    ${getInitials(player.name)}
                </div>

                <div>

                    <div class="option-name">
                        ${player.name}
                    </div>

                    <div class="option-pos">
                        ${player.pos}
                    </div>

                </div>

            `;

            if(!used){

                option.onclick=()=>{
                    selectPlayer(index);
                };

            }

            grid.appendChild(option);

        }
    );

}


/* =========================================================
   PLAYER SELECT
========================================================= */

function selectPlayer(
    playerIndex
){

    selected[currentSlot]=
        playerIndex;

    const player=
        players[playerIndex];

    const slot=
        document.getElementById(
            "slot-"+currentSlot
        );

    slot.classList.remove(
        "empty"
    );

    /*
       SAHADA SADECE TAM İSİM
       Avatar yok.
       Baş harf yok.
       GS yok.
    */

    slot.innerHTML=`

        <button
            onclick="openPlayerModal(${currentSlot})"
            aria-label="${player.name}"
        >

            <div class="player">

                <div class="player-name">
                    ${player.name}
                </div>

            </div>

        </button>

    `;

    updateCounter();

    updateMOTM();

    highlightMOTM();

    closeModal();

}


/* =========================================================
   MOTM
========================================================= */

function updateMOTM(){

    const section=
        document.getElementById(
            "motmSection"
        );

    const select=
        document.getElementById(
            "motmSelect"
        );

    const selectedPlayers=
        Object.values(selected);

    if(
        selectedPlayers.length!==11
    ){

        section.classList.remove(
            "show"
        );

        motm="";

        select.innerHTML=`
            <option value="">
                ⭐ Maçın oyuncusunu seç
            </option>
        `;

        highlightMOTM();

        return;

    }

    section.classList.add(
        "show"
    );

    select.innerHTML=`

        <option value="">
            ⭐ Maçın oyuncusunu seç
        </option>

    `;

    selectedPlayers.forEach(
        index=>{

            const option=
                document.createElement(
                    "option"
                );

            option.value=index;

            option.textContent=
                players[index].name;

            if(
                String(index)===
                String(motm)
            ){

                option.selected=true;

            }

            select.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   MOTM SELECT
========================================================= */

function selectMOTM(){

    motm=
        document.getElementById(
            "motmSelect"
        ).value;

    highlightMOTM();

}


/* =========================================================
   MOTM STAR
========================================================= */

function highlightMOTM(){

    document
        .querySelectorAll(
            ".motm-star"
        )
        .forEach(
            star=>
                star.remove()
        );

    if(
        motm===""
    ){

        return;

    }

    Object.keys(selected)
        .forEach(
            slotIndex=>{

                if(
                    String(
                        selected[slotIndex]
                    )===
                    String(motm)
                ){

                    const slot=
                        document.getElementById(
                            "slot-"+slotIndex
                        );

                    const star=
                        document.createElement(
                            "div"
                        );

                    star.className=
                        "motm-star";

                    star.innerText="⭐";

                    slot.appendChild(
                        star
                    );

                }

            }
        );

}


/* =========================================================
   INITIALS
   SADECE SEÇİM MODALINDA
========================================================= */

function getInitials(name){

    const parts=
        name
            .trim()
            .split(" ");

    if(
        parts.length===1
    ){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }

    return (
        parts[0][0]+
        parts[parts.length-1][0]
    ).toUpperCase();

}


/* =========================================================
   COUNTER
========================================================= */

function updateCounter(){

    const count=
        Object.keys(selected)
            .length;

    document.getElementById(
        "counter"
    ).innerText=
        count+
        " / 11 oyuncu";

    document.getElementById(
        "progressBar"
    ).style.width=
        (
            count/11*100
        )+
        "%";

    if(
        count===11
    ){

        updateMOTM();

    }

}


/* =========================================================
   RESET
========================================================= */

function resetSquad(){

    selected={};

    motm="";

    renderFormation();

    updateCounter();

    updateMOTM();

    toast(
        "Kadro sıfırlandı."
    );

}


/* =========================================================
   SAVE PNG
========================================================= */

async function saveImage(){

    if(
        Object.keys(selected)
            .length!==11
    ){

        toast(
            "Önce 11 oyuncuyu tamamla."
        );

        return;

    }

    if(
        motm===""
    ){

        toast(
            "Önce maçın oyuncusunu seç."
        );

        document
            .getElementById(
                "motmSelect"
            )
            .focus();

        return;

    }

    const pitch=
        document.getElementById(
            "pitch"
        );

    toast(
        "VIP kadro görseli hazırlanıyor..."
    );

    try{

        const canvas=
            await html2canvas(
                pitch,
                {
                    scale:3,
                    useCORS:true,
                    backgroundColor:null,
                    logging:false
                }
            );

        const link=
            document.createElement(
                "a"
            );

        const formation=
            document
                .getElementById(
                    "formation"
                )
                .value
                .replaceAll(
                    "-",
                    "_"
                );

        link.download=
            "GALATASARAY-VIP-KADRO-"+
            formation+
            ".png";

        link.href=
            canvas.toDataURL(
                "image/png"
            );

        link.click();

        toast(
            "VIP kadro görseli kaydedildi! 📸"
        );

    }
    catch(error){

        console.error(error);

        toast(
            "Görsel oluşturulamadı."
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const element=
        document.getElementById(
            "toast"
        );

    element.innerText=
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer=
        setTimeout(
            ()=>{
                element.classList.remove(
                    "show"
                );
            },
            2500
        );

}
