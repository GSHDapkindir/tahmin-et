<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GSHD | Skor Düdüğü</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --yellow:#ffd900;
    --yellow2:#ffad00;
    --green:#55ff91;
    --red:#ff3838;
    --blue:#29a9ea;
}

body{
    min-height:100vh;
    padding:24px 14px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(255,217,0,.13),
            transparent 38%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(255,255,255,.035),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(255,0,0,.045),
            transparent 35%
        ),
        #020202;

    color:#fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    overflow-x:hidden;
}

.app{
    width:min(940px,100%);
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:22px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:7px 15px;

    border-radius:50px;

    color:var(--yellow);

    background:rgba(255,217,0,.055);

    border:1px solid rgba(255,217,0,.2);

    font-size:10px;
    font-weight:900;

    letter-spacing:2.5px;

    margin-bottom:12px;
}

.badge-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 12px var(--green);

    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:.25;
    }
}

.header h1{
    font-size:clamp(27px,6vw,49px);

    font-weight:950;

    letter-spacing:-2px;
}

.header p{
    margin-top:7px;

    color:#666;

    font-size:12px;

    letter-spacing:1px;
}

/* MAÇ KARTI */

.match-card{
    position:relative;

    padding:
        clamp(28px,6vw,58px)
        clamp(17px,5vw,55px);

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(26,26,26,.95),
            rgba(5,5,5,.98)
        );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 35px 100px rgba(0,0,0,.78),
        inset 0 1px 0 rgba(255,255,255,.04);

    overflow:hidden;
}

.match-card::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(255,217,0,.035);

    filter:blur(90px);

    top:-270px;
    left:50%;

    transform:translateX(-50%);

    pointer-events:none;
}

/* TAKIMLAR */

.teams{
    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:24px;
}

.team{
    text-align:center;
}

.team-name{
    font-size:clamp(18px,4vw,30px);

    font-weight:950;

    letter-spacing:-.5px;
}

.sporting{
    color:#fff;

    text-shadow:
        0 0 20px rgba(255,255,255,.12);
}

.galatasaray{
    color:var(--yellow);

    text-shadow:
        0 0 12px rgba(255,217,0,.5),
        0 0 35px rgba(255,174,0,.16);
}

.vs{
    color:#444;

    font-size:10px;

    font-weight:900;

    letter-spacing:3px;
}

/* SKOR */

.score-area{
    text-align:center;

    padding:
        36px 0 29px;
}

.score{
    display:inline-block;

    min-width:250px;

    font-size:
        clamp(76px,18vw,150px);

    line-height:.85;

    font-weight:950;

    letter-spacing:7px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #f3f3f3 32%,
            #8a8a8a 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    filter:
        drop-shadow(
            0 0 16px
            rgba(255,255,255,.12)
        );

    transition:.12s;
}

.score.running{
    animation:
        scorePulse .11s infinite alternate;
}

@keyframes scorePulse{

    from{
        transform:scale(.97);

        filter:
            drop-shadow(
                0 0 7px
                rgba(255,255,255,.08)
            );
    }

    to{
        transform:scale(1.035);

        filter:
            drop-shadow(
                0 0 27px
                rgba(255,217,0,.2)
            );
    }
}

.status{
    margin-top:18px;

    color:#555;

    font-size:11px;

    font-weight:800;

    letter-spacing:1.7px;
}

.status.running{
    color:var(--green);
}

.status.stopped{
    color:var(--yellow);
}

/* BUTONLAR */

.controls{
    width:min(650px,100%);

    margin:auto;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

button{
    min-height:57px;

    border:0;

    border-radius:16px;

    font-size:13px;

    font-weight:950;

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s,
        opacity .2s;
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.97);
}

.start{
    color:#031109;

    background:
        linear-gradient(
            135deg,
            #6aff9e,
            #12bd5f
        );

    box-shadow:
        0 12px 30px
        rgba(0,220,100,.13);
}

.stop{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff4b4b,
            #c60000
        );

    box-shadow:
        0 12px 30px
        rgba(255,0,0,.13);
}

.reset{
    grid-column:1/-1;

    color:#999;

    background:#151515;

    border:1px solid #292929;
}

button:disabled{
    opacity:.28;

    cursor:not-allowed;

    transform:none;
}

/* SONUÇ */

.result{
    display:none;

    margin-top:25px;

    padding:25px 18px;

    border-radius:23px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,217,0,.09),
            rgba(255,255,255,.018)
        );

    border:
        1px solid
        rgba(255,217,0,.18);
}

.result.show{
    display:block;

    animation:
        resultIn .5s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes resultIn{

    from{
        opacity:0;

        transform:
            translateY(18px)
            scale(.96);
    }

    to{
        opacity:1;

        transform:none;
    }
}

.result-label{
    color:var(--yellow);

    font-size:9px;

    font-weight:950;

    letter-spacing:3px;
}

.result-score{
    margin-top:10px;

    font-size:
        clamp(21px,5vw,35px);

    font-weight:950;

    line-height:1.3;
}

.result-message{
    margin-top:14px;

    padding:15px;

    border-radius:15px;

    background:rgba(0,0,0,.3);

    border:1px solid rgba(255,255,255,.05);

    color:#aaa;

    font-size:12px;

    line-height:1.65;
}

/* TELEGRAM */

.telegram{
    width:100%;

    margin-top:18px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #2ab4f2,
            #168bd0
        );

    box-shadow:
        0 12px 30px
        rgba(42,180,242,.14);
}

.telegram:hover{
    box-shadow:
        0 15px 35px
        rgba(42,180,242,.28);
}

/* FOOTER */

.footer{
    margin-top:15px;

    text-align:center;

    color:#383838;

    font-size:9px;

    font-weight:700;

    letter-spacing:1.5px;
}

/* MOBİL */

@media(max-width:600px){

    body{
        padding:18px 11px;

        align-items:flex-start;
    }

    .match-card{
        border-radius:25px;

        padding:30px 15px;
    }

    .teams{
        gap:8px;
    }

    .team-name{
        font-size:15px;
    }

    .vs{
        font-size:8px;
    }

    .score-area{
        padding:30px 0 25px;
    }

    .score{
        min-width:0;

        font-size:79px;

        letter-spacing:4px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .reset{
        grid-column:auto;
    }

    button{
        min-height:59px;
    }
}
</style>
</head>

/* ==========================================
   RANDOM SKOR
========================================== */

function randomScore(){

    const index =
        Math.floor(
            Math.random() *
            scorePool.length
        );

    homeScore =
        scorePool[index][0];

    awayScore =
        scorePool[index][1];

    document.getElementById(
        "score"
    ).textContent =
        homeScore +
        " - " +
        awayScore;
}


/* ==========================================
   MESAJ SEÇ
========================================== */

function getResultMessage(){

    let messages;

    /*
        ÖNEMLİ:

        Galatasaray hiçbir sonuçta
        zorbalanmıyor.

        Bütün mizah Sporting
        üzerinden dönüyor.
    */

    if(awayScore > homeScore){

        messages = galaWinMessages;

    }

    else if(homeScore > awayScore){

        messages = galaLossMessages;

    }

    else{

        messages = drawMessages;

    }

    const index =
        Math.floor(
            Math.random() *
            messages.length
        );

    return messages[index];
}


/* ==========================================
   BAŞLAT
========================================== */

function startGame(){

    if(running) return;

    running = true;

    document.getElementById(
        "startBtn"
    ).disabled = true;

    document.getElementById(
        "stopBtn"
    ).disabled = false;

    document.getElementById(
        "result"
    ).classList.remove(
        "show"
    );

    document.getElementById(
        "score"
    ).classList.add(
        "running"
    );

    document.getElementById(
        "status"
    ).textContent =
        "SKOR MOTORU ÇALIŞIYOR...";

    document.getElementById(
        "status"
    ).className =
        "status running";

    timer = setInterval(
        randomScore,
        25
    );
}


/* ==========================================
   DURDUR
========================================== */

function stopGame(){

    if(!running) return;

    running = false;

    clearInterval(timer);

    document.getElementById(
        "score"
    ).classList.remove(
        "running"
    );

    document.getElementById(
        "stopBtn"
    ).disabled = true;

    document.getElementById(
        "status"
    ).textContent =
        "SKOR KİLİTLENDİ • KARAR KESİN";

    document.getElementById(
        "status"
    ).className =
        "status stopped";


    /* SONUÇ */

    document.getElementById(
        "finalScore"
    ).textContent =
        "SPORTING LİZBON " +
        homeScore +
        " — " +
        awayScore +
        " GALATASARAY";


    /* MESAJ */

    document.getElementById(
        "message"
    ).textContent =
        getResultMessage();


    const result =
        document.getElementById(
            "result"
        );


    /*
       Sonuca göre başlık
    */

    if(awayScore > homeScore){

        document.getElementById(
            "resultLabel"
        ).textContent =
            "🟡 GALATASARAY KAZANDI";

    }

    else if(homeScore > awayScore){

        document.getElementById(
            "resultLabel"
        ).textContent =
            "⚽ SPORTING KAZANDI";

    }

    else{

        document.getElementById(
            "resultLabel"
        ).textContent =
            "⚖ BERABERLİK";

    }


    result.classList.add(
        "show"
    );
}


/* ==========================================
   RESET
========================================== */

function resetGame(){

    clearInterval(timer);

    running = false;

    homeScore = 0;
    awayScore = 0;


    document.getElementById(
        "score"
    ).textContent =
        "0 - 0";


    document.getElementById(
        "score"
    ).classList.remove(
        "running"
    );


    document.getElementById(
        "status"
    ).textContent =
        "SKOR MOTORU HAZIR";


    document.getElementById(
        "status"
    ).className =
        "status";


    document.getElementById(
        "startBtn"
    ).disabled = false;


    document.getElementById(
        "stopBtn"
    ).disabled = true;


    document.getElementById(
        "result"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "message"
    ).textContent = "";

}


/* ==========================================
   TELEGRAM
========================================== */

function shareTelegram(){

    const message =
        document.getElementById(
            "message"
        ).textContent;


    let emoji = "⚽";


    if(awayScore > homeScore){

        emoji = "🟡🦁";

    }

    else if(homeScore > awayScore){

        emoji = "🦁";

    }


    const text =

        emoji +
        " GSHD • SKOR DÜDÜĞÜ\n" +

        "━━━━━━━━━━━━━━━━\n\n" +

        "🏟 SPORTING LİZBON\n" +

        "        " +
        homeScore +
        " — " +
        awayScore +

        "\n" +

        "⭐ GALATASARAY\n\n" +

        "🔒 SKOR KİLİTLENDİ\n\n" +

        "💬 " +
        message +

        "\n\n" +

        "🎯 GSHD • PREMIUM RANDOM SCORE SYSTEM";


    /*
       Lokal dosyada localhost/file
       paylaşılmasın.

       GitHub Pages / gerçek HTTPS
       adresinde URL eklenir.
    */

    let urlPart = "";

    if(
        window.location.protocol === "http:" ||
        window.location.protocol === "https:"
    ){

        urlPart =
            "&url=" +
            encodeURIComponent(
                window.location.href
            );

    }


    const telegramUrl =

        "https://t.me/share/url" +

        "?text=" +

        encodeURIComponent(
            text
        ) +

        urlPart;


    window.open(
        telegramUrl,
        "_blank",
        "noopener,noreferrer"
    );
}


/* ==========================================
   KLAVYE KONTROLÜ

   ENTER / SPACE = BAŞLAT / DURDUR
   R = RESET
========================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" ||
            e.key === " "
        ){

            e.preventDefault();

            if(running){

                stopGame();

            }

            else{

                startGame();

            }

        }


        if(
            e.key.toLowerCase() === "r"
        ){

            resetGame();

        }

    }
);

</script>
